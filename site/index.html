<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mástil</title>
<meta name="description" content="Toca notas en el mástil de la guitarra y ve la nota, el intervalo o el acorde, con sonido e inversiones.">
<meta name="theme-color" content="#e8ece9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1211" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script>(function(){var t=null;try{t=localStorage.getItem('mastil-theme')}catch(e){}if(t!=='light'&&t!=='dark')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';document.documentElement.dataset.theme=t})();</script>
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: lectura fija arriba (nota / intervalo / acorde), mástil en medio, inversiones debajo. Madera oscura sobre fondo neutro verdoso. */
:root{
  --bg:#e8ece9; --panel:#f5f7f6; --ink:#16201d; --muted:#5d6b66; --line:#c9d2ce;
  --accent:#0e6b5f; --accent-ink:#f3fffc;
  --wood:#2b1f19; --fret:#bdb8ab; --nut:#e9e3cf; --inlay:rgba(233,227,207,.2);
  --str-plain:#d6d2c6; --str-wound:#b88a52; --ghost:rgba(233,227,207,.4);
  --r:#f2a63b; --t:#5ec8ee; --f:#b9a0f7; --s:#f26d8d; --x:#86d68f;
  --neutral:#ece6d6; --ontone:#17110d;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif;
  --font-b:'Figtree',system-ui,sans-serif;
  --font-m:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1211; --panel:#151c1a; --ink:#e4ece8; --muted:#8fa19a; --line:#26302d;
  --accent:#4fd1b8; --accent-ink:#06211c; --wood:#211711; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1211; --panel:#151c1a; --ink:#e4ece8; --muted:#8fa19a; --line:#26302d;
  --accent:#4fd1b8; --accent-ink:#06211c; --wood:#211711; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-b);padding-inline:16px;padding-block:16px 40px}
.app{max-width:62rem;margin-inline:auto;display:grid;gap:.9rem}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.4rem .9rem}
h1{font:800 1.7rem/1 var(--font-d);margin:0;letter-spacing:-.01em}
.tag{font:500 .72rem var(--font-m);color:var(--muted);letter-spacing:.04em}
button{font:inherit;color:inherit}
.btn{font:600 .85rem var(--font-b);padding:.5rem .85rem;min-height:2.5rem;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn:focus-visible,.cell:focus-visible,.vcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:inline-flex}
.seg .btn:first-child{border-radius:8px 0 0 8px}
.seg .btn:last-child{border-radius:0 8px 8px 0;border-left:0}

/* lectura */
.readout{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.75rem .9rem;display:grid;gap:.45rem;box-shadow:0 8px 20px -14px rgba(0,0,0,.45)}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem}
.eyebrow{font:600 .68rem var(--font-m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big{font:800 2.5rem/1.05 var(--font-d);letter-spacing:-.01em;overflow-wrap:anywhere}
.big.sm{font-size:1.45rem}
.sub{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:.3rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font:600 .78rem var(--font-m);padding:.14rem .5rem .14rem .16rem;border:1px solid var(--line);border-radius:999px}
.chip i{font-style:normal;min-width:1.2rem;height:1.2rem;padding-inline:.15rem;border-radius:999px;background:var(--c);color:var(--ontone);display:grid;place-items:center;font-size:.62rem}
.alt{font-size:.82rem;color:var(--muted)}
.alt b{font-family:var(--font-m);font-weight:600;color:var(--ink)}

/* mástil */
.stage{display:grid;gap:.5rem}
.scroller{overflow-x:auto;padding-bottom:.25rem}
.board{display:grid;position:relative;font-family:var(--font-m)}
.board.h{grid-template-columns:2.2rem 3rem repeat(15,minmax(2.9rem,1fr));grid-template-rows:repeat(6,2.6rem) 1.6rem;min-width:50rem}
.board.v{grid-template-columns:2.2rem repeat(6,minmax(0,1fr));grid-template-rows:1.8rem 3rem repeat(15,2.6rem)}
.wood{background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.18)),var(--wood);border-radius:6px}
.board.v .wood{background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(0,0,0,.18)),var(--wood)}
.inlay{display:flex;align-items:center;justify-content:center;pointer-events:none}
.inlay.double{justify-content:space-around;padding-block:1.6rem}
.board.v .inlay.double{flex-direction:row;padding-block:0;padding-inline:1.4rem}
.inlay.double{flex-direction:column}
.inlay b{width:.85rem;height:.85rem;border-radius:50%;background:var(--inlay)}
.lab{display:grid;place-items:center;font-size:.72rem;font-weight:500;color:var(--muted)}
.lab.mark{color:var(--ink);font-weight:600}
.cell{position:relative;border:0;background:none;padding:0;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cell::before{content:"";position:absolute;background:var(--sc)}
.board.h .cell::before{left:0;right:0;top:50%;height:var(--sw);transform:translateY(-50%)}
.board.v .cell::before{top:0;bottom:0;left:50%;width:var(--sw);transform:translateX(-50%)}
.cell::after{content:"";position:absolute;background:var(--fret)}
.board.h .cell::after{top:0;bottom:0;right:0;width:2px}
.board.v .cell::after{left:0;right:0;bottom:0;height:2px}
.cell.open{background:rgba(0,0,0,.28)}
.board.h .cell.open::after{width:5px;background:var(--nut)}
.board.v .cell.open::after{height:5px;background:var(--nut)}
.cell:hover .dot.off{box-shadow:inset 0 0 0 2px var(--ghost)}
.dot{position:relative;z-index:1;width:1.95rem;height:1.95rem;border-radius:50%;display:grid;place-items:center;font:600 .74rem/1 var(--font-m);color:var(--ontone)}
.dot.on{background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.4)}
.dot.on.ring{background:var(--wood);color:var(--c);box-shadow:inset 0 0 0 2.5px var(--c)}
.dot.ghost{color:var(--ghost);font-size:.66rem}
.dot.hint{color:var(--c);font-size:.68rem;box-shadow:inset 0 0 0 1.5px var(--c);background:rgba(0,0,0,.35)}
.hintline{font-size:.8rem;color:var(--muted)}

/* inversiones */
.inv{display:grid;gap:.7rem;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem}
.inv h2{margin:0;font:800 1.15rem/1.2 var(--font-d)}
.tabs{display:flex;flex-wrap:wrap;gap:.4rem}
.tab{font:600 .8rem var(--font-b);padding:.4rem .7rem;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;min-height:2.3rem;text-align:left}
.tab small{display:block;font:500 .68rem var(--font-m);color:var(--muted)}
.tab[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.2rem,1fr));gap:.6rem}
.vcard{display:grid;justify-items:center;gap:.2rem;padding:.45rem .3rem .5rem;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;min-width:0}
.vcard svg{width:100%;max-width:5.6rem;height:auto}
.vmeta{font:500 .68rem var(--font-m);color:var(--muted);text-align:center}
.vcard:hover{border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.btn,.vcard,.tab{transition:border-color .15s}}

/* controles: dentro del cuadro de lectura en pantallas anchas, debajo en angostas */
.rd{display:grid;gap:.45rem;min-width:0}
.ctl{display:grid;gap:.5rem;align-content:start}
@media (min-width:860px){
  .readout{grid-template-columns:minmax(0,1fr) auto;column-gap:1.2rem;align-items:start}
  .readout .ctl{max-width:31rem;justify-items:end}
  .readout .ctl .row{justify-content:flex-end}
}

/* tema + creador de acordes */
.hright{display:flex;align-items:center;gap:.6rem}
.btn.icon{min-height:2.1rem;min-width:2.1rem;padding:.2rem .5rem;font-size:1.05rem;line-height:1;border-radius:999px}
dialog.builder{width:min(34rem,calc(100vw - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);overflow:hidden}
dialog.builder[open]{display:flex;flex-direction:column}
dialog.builder::backdrop{background:rgba(0,0,0,.55)}
.bhead,.bfoot{display:flex;justify-content:space-between;align-items:center;gap:.6rem;padding:.8rem 1rem}
.bhead{border-bottom:1px solid var(--line)}.bfoot{border-top:1px solid var(--line);flex-wrap:wrap}
.bhead h2{margin:0;font:800 1.15rem var(--font-d)}
.bbody{padding:.8rem 1rem;overflow-y:auto;display:grid;gap:.8rem}
.bbody h3{margin:0 0 .4rem;font:600 .68rem var(--font-m);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.rootgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.2rem,1fr));gap:.4rem}
.opt{font:600 .9rem var(--font-b);padding:.4rem .3rem;min-height:2.5rem;border-radius:8px;border:1px solid var(--line);background:transparent;cursor:pointer;text-align:center}
.opt small{display:block;font:500 .64rem var(--font-m);color:var(--muted);overflow-wrap:anywhere}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bprev{font-size:.85rem;color:var(--muted)}.bprev b{font:800 1.3rem var(--font-d);color:var(--ink);display:block}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* botones de ícono, nombre del acorde como botón y tooltips */
.btn.ib{min-width:2.9rem;padding:.4rem .6rem;font-size:1.15rem;line-height:1}
[data-tip]{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.bigbtn{font:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;overflow-wrap:anywhere;border-bottom:2px dashed var(--line)}
.bigbtn::after{content:" ▾";font-size:.45em;color:var(--muted);vertical-align:middle}
.bigbtn:hover{border-bottom-color:var(--accent)}.bigbtn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
/* capo */
.capo{display:none;pointer-events:none;z-index:3;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.55)}
.capo.show{display:block}.capo.pv{opacity:.55}
.board.h .capo{justify-self:end;width:.7rem;margin-right:.12rem;background:linear-gradient(90deg,#d3dad8,#8a9592)}
.board.v .capo{align-self:end;height:.7rem;margin-bottom:.12rem;background:linear-gradient(180deg,#d3dad8,#8a9592)}
.cell.dead{background:rgba(0,0,0,.4);cursor:not-allowed}.cell.dead .dot{opacity:.3}
.btn.armed{border-style:dashed;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
#capo{touch-action:none}
.dragghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-120%);font-size:1.6rem;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.linkbtn{font:600 .8rem var(--font-b);color:var(--accent);background:none;border:0;padding:.2rem 0;cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.6rem .8rem;display:grid;gap:.35rem}
.sheet svg{width:100%;max-width:30rem;max-height:17rem;height:auto;color:var(--ink)}
.sheet .cap{font-size:.74rem;color:var(--muted)}
/* en pantallas anchas la partitura vive dentro del cuadro de arriba, entre la lectura y los botones */
@media (min-width:860px){
  .readout.hassheet{grid-template-columns:minmax(0,1fr) minmax(0,15rem) auto}
  .readout .rd{grid-column:1}.readout .sheet{grid-column:2}.readout .ctl{grid-column:3}
  .sheet.inline{background:none;border:0;padding:0;align-self:center;justify-items:center}
  .sheet.inline .eyebrow,.sheet.inline .cap{display:none}
  .sheet.inline svg{max-width:none;max-height:9.5rem}
}
#tip{position:fixed;z-index:60;left:0;top:0;background:var(--ink);color:var(--bg);font:600 .78rem/1.3 var(--font-b);padding:.35rem .6rem;border-radius:6px;pointer-events:none;max-width:16rem;opacity:0}
#tip.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Mástil</h1>
    <div class="hright">
      <span class="tag" data-i="tag">6 CUERDAS · AFINACIÓN E A D G B E · 15 TRASTES</span>
      <button class="btn icon" id="lang" aria-label="Switch to English" data-tip="English">EN</button>
      <button class="btn icon" id="theme" aria-label="Cambiar entre tema claro y oscuro" data-tip="Tema claro / oscuro">☾</button>
    </div>
  </header>

  <section class="readout" id="top">
    <div class="rd" id="readout" aria-live="polite"></div>
    <div class="ctl" id="ctl">
      <div class="row">
        <button class="btn primary ib" id="strum" data-t="strum">▶</button>
        <button class="btn ib" id="clear" data-t="clear">🧹</button>
        <button class="btn ib" id="rotate" data-t="rotate">🔄</button>
        <button class="btn ib" id="build" data-t="sheet" aria-pressed="false">🎼</button>
        <button class="btn ib" id="capo" aria-pressed="false">🗜️</button>
      </div>
      <div class="row">
        <span class="seg" role="group" aria-label="Notación" data-a="notation">
          <button class="btn" id="n-let" aria-pressed="true">C D E</button><button class="btn" id="n-sol" aria-pressed="false">Do Re Mi</button>
        </span>
        <button class="btn ib" id="showall" aria-pressed="false" data-t="showall">👁</button>
        <button class="btn ib" id="autostrum" aria-pressed="false" data-t="autostrum">🔊</button>
      </div>
    </div>
  </section>

  <section class="stage" id="stage">
    <div class="hintline" id="hint" data-i="hint">Una nota por cuerda: tocar otro traste de la misma cuerda la reemplaza, tocarla de nuevo la quita.</div>
    <div class="sheet" id="sheet" hidden></div>
    <div class="scroller"><div class="board v" id="board"></div></div>
  </section>

  <section class="inv" id="inv" hidden></section>
</div>

<dialog class="builder" id="builder" aria-labelledby="btitle">
  <div class="bhead"><h2 id="btitle" data-i="build0">Seleccionar acorde</h2><button class="btn icon" id="bx" aria-label="Cancelar" data-a="cancel">✕</button></div>
  <div class="bbody">
    <div><h3 data-i="hroot">Nota raíz</h3><div class="rootgrid" id="broots"></div></div>
    <div><h3 data-i="htype">Tipo de acorde</h3><div class="typegrid" id="btypes"></div></div>
  </div>
  <div class="bfoot">
    <div class="bprev" id="bprev" aria-live="polite"></div>
    <button class="btn primary" id="bok" data-i="bok">Listo</button>
  </div>
</dialog>

<script>
const OPEN=[40,45,50,55,59,64], STRN=['E','A','D','G','B','e'], FRETS=15;
const NEUTRAL=['C','C♯','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const MAJ_ROOT=['C','D♭','D','E♭','E','F','F♯','G','A♭','A','B♭','B'];
const MIN_ROOT=['C','C♯','D','E♭','E','F','F♯','G','G♯','A','B♭','B'];
const LET=['C','D','E','F','G','A','B'], LETPC=[0,2,4,5,7,9,11];
const SOL={C:'Do',D:'Re',E:'Mi',F:'Fa',G:'Sol',A:'La',B:'Si'};
const DEG={'1':[0,0],'b2':[1,1],'2':[1,2],'b3':[2,3],'3':[2,4],'4':[3,5],'#4':[3,6],'b5':[4,6],'5':[4,7],'#5':[4,8],'6':[5,9],'bb7':[6,9],'b7':[6,10],'7':[6,11],'b9':[1,1],'9':[1,2],'#9':[1,3]};

const TPL_SRC=[
 ['1 3 5','','mayor'],['1 b3 5','m','menor',1],['1 b3 b5','dim','disminuido',1],['1 3 #5','aug','aumentado'],
 ['1 2 5','sus2','suspendido 2'],['1 4 5','sus4','suspendido 4'],
 ['1 3 5 b7','7','dominante (7ª menor)'],['1 3 5 7','maj7','mayor con 7ª mayor'],['1 b3 5 b7','m7','menor con 7ª menor',1],
 ['1 b3 5 7','m(maj7)','menor con 7ª mayor',1],['1 b3 b5 b7','m7♭5','semidisminuido',1],['1 b3 b5 bb7','dim7','disminuido con 7ª disminuida',1],
 ['1 3 5 6','6','mayor con 6ª'],['1 b3 5 6','m6','menor con 6ª',1],['1 3 #5 b7','7♯5','dominante con 5ª aumentada'],
 ['1 4 5 b7','7sus4','dominante suspendido 4'],['1 3 5 9','add9','mayor con 9ª añadida'],['1 b3 5 9','m(add9)','menor con 9ª añadida',1],
 ['1 3 5 b7 9','9','dominante con 9ª'],['1 3 5 7 9','maj9','mayor con 7ª y 9ª'],['1 b3 5 b7 9','m9','menor con 7ª y 9ª',1],
 ['1 3 5 6 9','6/9','mayor con 6ª y 9ª'],['1 3 5 b7 b9','7♭9','dominante con 9ª menor'],['1 3 5 b7 #9','7♯9','dominante con 9ª aumentada'],
 ['1 3 b7','7(sin 5)','dominante sin quinta'],['1 3 7','maj7(sin 5)','7ª mayor sin quinta'],['1 b3 b7','m7(sin 5)','menor 7 sin quinta',1],
 ['1 5','5','quinta (power chord)']
];

const INT={0:'Unísono',1:'2ª menor',2:'2ª mayor',3:'3ª menor',4:'3ª mayor',5:'4ª justa',6:'Tritono',7:'5ª justa',8:'6ª menor',9:'6ª mayor',10:'7ª menor',11:'7ª mayor',12:'Octava',13:'9ª menor',14:'9ª mayor',15:'3ª menor + 8ª',16:'3ª mayor + 8ª',17:'11ª justa',18:'Tritono + 8ª',19:'5ª justa + 8ª',20:'6ª menor + 8ª',21:'6ª mayor + 8ª',22:'7ª menor + 8ª',23:'7ª mayor + 8ª',24:'Doble octava'};
const INT_EN={0:'Unison',1:'Minor 2nd',2:'Major 2nd',3:'Minor 3rd',4:'Major 3rd',5:'Perfect 4th',6:'Tritone',7:'Perfect 5th',8:'Minor 6th',9:'Major 6th',10:'Minor 7th',11:'Major 7th',12:'Octave',13:'Minor 9th',14:'Major 9th',15:'Minor 3rd + octave',16:'Major 3rd + octave',17:'Perfect 11th',18:'Tritone + octave',19:'Perfect 5th + octave',20:'Minor 6th + octave',21:'Major 6th + octave',22:'Minor 7th + octave',23:'Major 7th + octave',24:'Two octaves'};

/* ---------- idioma ---------- */
let lang='es';
try{const s=localStorage.getItem('mastil-lang'); lang=(s==='es'||s==='en')?s:((navigator.language||'es').toLowerCase().startsWith('es')?'es':'en')}catch(e){}
const tr=(es,en)=>lang==='en'?en:es;

const symT=t=>lang==='en'?t.sym.replace(/sin (\d)/g,'no $1'):t.sym;
const descT=t=>lang==='en'&&t.en?t.en:t.es;
const intName=d=>{
  const I=lang==='en'?INT_EN:INT;
  if(I[d])return I[d];
  const o=Math.floor(d/12),r=d%12, w=lang==='en'?(o>1?' octaves':' octave'):(o>1?' octavas':' octava');
  return r===0?o+(lang==='en'?' octaves':' octavas'):I[r]+' + '+o+w;
};

let sel=[null,null,null,null,null,null];
let notation='let', showAll=false, autoStrum=false, orient=innerWidth<720?'v':'h';
let capo=0, capoArmed=false, curChord=null, sheetOpen=false, invOpen=true, invIdx=0, invMore=false, lastKey='', voiceList=[], pinned=null;

const $=id=>document.getElementById(id);
const fmt=n=>notation==='sol'?(SOL[n[0]]+n.slice(1)):n;
const altFmt=n=>notation==='sol'?n:(SOL[n[0]]+n.slice(1));
const mod=(a,b)=>((a%b)+b)%b;

function spell(rootName,semis,step){
  const li=LET.indexOf(rootName[0]), acc=rootName.slice(1);
  const rpc=LETPC[li]+(acc==='♯'?1:acc==='♭'?-1:0);
  const tl=(li+step)%7, tpc=mod(rpc+semis,12);
  const diff=mod(tpc-LETPC[tl]+6,12)-6;
  const a={'-2':'♭♭','-1':'♭','0':'','1':'♯','2':'♯♯'}[diff];
  return LET[tl]+(a===undefined?'':a);
}
function getNotes(){
  const out=[];
  for(let s=0;s<6;s++) if(sel[s]!==null) out.push({s,f:sel[s],midi:OPEN[s]+sel[s]});
  return out.sort((a,b)=>a.midi-b.midi);
}
function detect(notes){
  const pcs=[...new Set(notes.map(n=>n.midi%12))], bass=notes[0].midi%12, out=[];
  for(const root of pcs){
    TPL.forEach((t,ti)=>{
      if(t.tones.length!==pcs.length) return;
      if(!t.tones.every(x=>pcs.includes((root+x.semis)%12))) return;
      const rootName=(t.minor?MIN_ROOT:MAJ_ROOT)[root];
      const tones=t.tones.map(x=>({...x,pc:(root+x.semis)%12,name:spell(rootName,x.semis,x.step)}));
      out.push({root,rootName,t,ti,tones,bassIsRoot:root===bass});
    });
  }
  out.sort((a,b)=>(b.bassIsRoot-a.bassIsRoot)||(a.ti-b.ti));
  return out.length?out:fallback(pcs,bass);
}

/* Nombre para cualquier conjunto de 3+ notas distintas: tercera, quinta, séptima y extensiones. */
function describe(root,pcs,bass){
  const rest=new Set(pcs.map(p=>mod(p-root,12))); rest.delete(0);
  const take=x=>rest.delete(x);
  let third=null,fifth=null,sev=null,six=false;
  if(take(4)) third='M'; else if(take(3)) third='m'; else if(take(2)) third='s2'; else if(take(5)) third='s4';
  if(take(7)) fifth='P'; else if(take(6)) fifth='d'; else if(take(8)) fifth='A';
  if(take(11)) sev='M'; else if(take(10)) sev='m';
  else if(third==='m'&&fifth==='d'&&take(9)) sev='d';
  else if(take(9)) six=true;
  const ext=[...rest].sort((a,b)=>a-b);
  const lab={
    0:['R',0,'r'], 1:['♭9',1,'x'], 2:third==='s2'?['2',1,'t']:['9',1,'x'],
    3:third==='m'?['♭3',2,'t']:['♯9',1,'x'], 4:['3',2,'t'],
    5:third==='s4'?['4',3,'t']:['11',3,'x'], 6:fifth==='d'?['♭5',4,'f']:['♯11',3,'x'], 7:['5',4,'f'],
    8:fifth==='A'?['♯5',4,'f']:['♭13',5,'x'], 9:sev==='d'?['♭♭7',6,'s']:six?['6',5,'s']:['13',5,'x'],
    10:['♭7',6,sev==='m'?'s':'x'], 11:['7',6,'s']
  };
  const rootName=(third==='m'?MIN_ROOT:MAJ_ROOT)[root];
  const tones=pcs.map(p=>{const semis=mod(p-root,12),[label,step,role]=lab[semis];
      return {token:label,step,semis,label,role,pc:p,name:spell(rootName,semis,step)}})
    .sort((a,b)=>({r:0,t:1,f:2,s:3,x:4}[a.role]*100+a.semis)-({r:0,t:1,f:2,s:3,x:4}[b.role]*100+b.semis));
  const extL=ext.map(s=>lab[s][0]);
  const compact9=(sev==='M'||sev==='m')&&ext.length===1&&ext[0]===2&&third!=='s2';
  const n7=compact9?'9':'7', alt=[];
  let core;
  if(third==='m'&&fifth==='d'&&sev==='d') core='dim7';
  else if(third==='m'&&fifth==='d'&&sev==='m') core='m'+n7+'♭5';
  else if(third==='m'&&fifth==='d'&&!sev&&!six) core='dim';
  else if(third==='M'&&fifth==='A'&&!sev&&!six) core='aug';
  else{
    const sus=third==='s2'?'sus2':third==='s4'?'sus4':'';
    const sv=sev==='M'?(third==='m'?'(maj'+n7+')':'maj'+n7):sev==='m'?n7:six?'6':'';
    core=sus?(sev==='M'?'maj'+n7:sev==='m'?n7:'')+sus:(third==='m'?'m':'')+sv;
    if(fifth==='d') alt.push('♭5'); if(fifth==='A') alt.push('♯5');
  }
  const items=[...alt,...(compact9?[]:extL.map(l=>(sev||six?'':'add')+l))];
  if(!fifth) items.push('sin 5');
  if(!third) items.push('sin 3');
  const sym=!items.length?core:core.endsWith(')')?core.slice(0,-1)+','+items.join(',')+')'
    :core===''&&items.length===1?items[0]:core+'('+items.join(',')+')';
  const es=[third==='M'?'3ª mayor':third==='m'?'3ª menor':third==='s2'?'suspendido 2':third==='s4'?'suspendido 4':'sin 3ª',
    fifth==='P'?'5ª justa':fifth==='d'?'5ª disminuida':fifth==='A'?'5ª aumentada':'sin 5ª',
    sev==='M'?'7ª mayor':sev==='m'?'7ª menor':sev==='d'?'7ª disminuida':six?'6ª':null,
    ...extL.map(l=>'+ '+l)].filter(Boolean).join(', ');
  const en=[third==='M'?'major 3rd':third==='m'?'minor 3rd':third==='s2'?'suspended 2':third==='s4'?'suspended 4':'no 3rd',
    fifth==='P'?'perfect 5th':fifth==='d'?'diminished 5th':fifth==='A'?'augmented 5th':'no 5th',
    sev==='M'?'major 7th':sev==='m'?'minor 7th':sev==='d'?'diminished 7th':six?'6th':null,
    ...extL.map(l=>'+ '+l)].filter(Boolean).join(', ');
  const score=alt.length*2+ext.length*2+(third?0:3)+(third==='s2'||third==='s4'?1:0)+(fifth?0:1)+(root===bass?0:1);
  return {root,rootName,t:{sym,es,en,minor:third==='m'},ti:100,tones,bassIsRoot:root===bass,score};
}
function fallback(pcs,bass){
  if(pcs.length<3) return [];
  return pcs.map(r=>describe(r,pcs,bass)).sort((a,b)=>(a.score-b.score)||(b.bassIsRoot-a.bassIsRoot));
}
const symOf=(c,bassPc)=>{
  let s=fmt(c.rootName)+symT(c.t);
  if(bassPc!==c.root){const b=c.tones.find(t=>t.pc===bassPc);s+='/'+fmt(b.name)}
  return s;
};
const oct=m=>Math.floor(m/12)-1;
const hz=m=>440*Math.pow(2,(m-69)/12);

/* ---------- audio ---------- */
let ac=null; const cache=new Map();
function ctx(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)()}
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function bufFor(m){
  if(cache.has(m)) return cache.get(m);
  const sr=ac.sampleRate, N=Math.max(2,Math.round(sr/hz(m))), len=Math.floor(sr*2.4);
  const ring=new Float32Array(N); let prev=0;
  for(let i=0;i<N;i++){prev=prev*.45+(Math.random()*2-1)*.55;ring[i]=prev}
  const out=new Float32Array(len); let idx=0, peak=0;
  for(let i=0;i<len;i++){
    const cur=ring[idx], nxt=ring[(idx+1)%N];
    out[i]=cur; ring[idx]=(cur+nxt)*.5*.9985; idx=(idx+1)%N;
    const a=Math.abs(cur); if(a>peak) peak=a;
  }
  const fade=Math.floor(sr*.25), k=.55/(peak||1);
  for(let i=0;i<len;i++){out[i]*=k; if(i>len-fade) out[i]*=(len-i)/fade}
  const b=ac.createBuffer(1,len,sr); b.copyToChannel(out,0);
  cache.set(m,b); return b;
}
function pluck(m,delay){
  try{
    const a=ctx(), src=a.createBufferSource(), g=a.createGain();
    src.buffer=bufFor(m); g.gain.value=.85;
    src.connect(g); g.connect(a.destination); src.start(a.currentTime+(delay||0));
  }catch(e){}
}
function strum(){getNotes().forEach((n,i)=>pluck(n.midi,i*.045))}

/* ---------- mástil ---------- */
const board=$('board'); const cells=[]; const els={wood:null,inlays:[],strLabs:[],fretLabs:[]};
const cellLabel=(s,f)=>tr(`Cuerda ${6-s}, traste ${f}, `,`String ${6-s}, fret ${f}, `)+NEUTRAL[(OPEN[s]+f)%12];
const area=(el,r1,c1,r2,c2)=>{el.style.gridArea=`${r1} / ${c1} / ${r2} / ${c2}`};
function build(){
  const wood=document.createElement('div'); wood.className='wood'; els.wood=wood; board.appendChild(wood);
  [3,5,7,9,12,15].forEach(f=>{
    const d=document.createElement('div'); d.className='inlay'+(f===12?' double':'');
    d.innerHTML=f===12?'<b></b><b></b>':'<b></b>'; d.dataset.f=f; els.inlays.push(d); board.appendChild(d);
  });
  for(let s=0;s<6;s++){
    const l=document.createElement('div'); l.className='lab'; l.textContent=STRN[s]; l.dataset.s=s; els.strLabs.push(l); board.appendChild(l);
  }
  for(let f=1;f<=FRETS;f++){
    const l=document.createElement('div'); l.className='lab'+([3,5,7,9,12,15].includes(f)?' mark':''); l.textContent=f; l.dataset.f=f; els.fretLabs.push(l); board.appendChild(l);
  }
  for(let s=0;s<6;s++) for(let f=0;f<=FRETS;f++){
    const b=document.createElement('button'); b.className='cell'+(f===0?' open':'');
    b.style.setProperty('--sw',[3.2,2.6,2.1,1.7,1.3,1][s]+'px');
    b.style.setProperty('--sc',s<3?'var(--str-wound)':'var(--str-plain)');
    b.setAttribute('aria-label',cellLabel(s,f));
    const dot=document.createElement('span'); dot.className='dot off'; b.appendChild(dot);
    b.addEventListener('click',()=>onCell(s,f));
    b.dataset.s=s; b.dataset.f=f;
    cells.push({s,f,el:b,dot}); board.appendChild(b);
  }
  layout();
}
function layout(){
  const h=orient==='h'; board.className='board '+orient;
  area(els.wood,...(h?[1,2,7,18]:[2,2,18,8]));
  els.inlays.forEach(d=>{const f=+d.dataset.f; h?area(d,1,f+2,7,f+3):area(d,f+2,2,f+3,8)});
  els.strLabs.forEach(l=>{const s=+l.dataset.s; if(h){const r=6-s;area(l,r,1,r+1,2)}else area(l,1,s+2,2,s+3)});
  els.fretLabs.forEach(l=>{const f=+l.dataset.f; h?area(l,7,f+2,8,f+3):area(l,f+2,1,f+3,2)});
  cells.forEach(c=>{ if(h){const r=6-c.s;area(c.el,r,c.f+2,r+1,c.f+3)}else area(c.el,c.f+2,c.s+2,c.f+3,c.s+3) });
  drawCapo();
}
function onCell(s,f){
  if(capoArmed){ capoArmed=false; if(f>=1) setCapo(f); else syncCapoBtn(); return; }
  if(f<capo) return; // detrás del capo no se puede tocar
  pinned=null;
  // con capo, quitar una nota deja la cuerda en el traste del capo; tocar el capo mismo la silencia
  sel[s]=sel[s]===f?((capo&&f>capo)?capo:null):f;
  update();
  const notes=getNotes();
  if(sel[s]===f){ if(autoStrum&&notes.length>1) strum(); else pluck(OPEN[s]+f) }
}

/* ---------- capo ---------- */
/* Poner un capo en el traste N: todas las cuerdas quedan picadas ahí (las notas más agudas ya elegidas se conservan).
   Moverlo: las cuerdas que estaban en el capo viejo se van al nuevo. Quitarlo: las cuerdas que solo tenían el capo se apagan. */
function setCapo(n){
  const old=capo; capo=n; pinned=null; capoArmed=false;
  for(let s=0;s<6;s++){
    const v=sel[s];
    if(n===0){ if(v===old) sel[s]=null; }
    else if(old===0){ if(v===null||v<n) sel[s]=n; }
    else if(v!==null&&(v===old||v<n)) sel[s]=n;
  }
  drawCapo(); syncCapoBtn(); update();
}
const capoEl=document.createElement('div'); capoEl.className='capo'; capoEl.setAttribute('aria-hidden','true'); board.appendChild(capoEl);
function drawCapo(preview){
  const f=preview||capo; capoEl.classList.toggle('show',f>0); capoEl.classList.toggle('pv',!!preview);
  if(f>0) orient==='h'?area(capoEl,1,f+2,7,f+3):area(capoEl,f+2,2,f+3,8);
}
function syncCapoBtn(){
  const b=$('capo'); b.setAttribute('aria-pressed',capo>0); b.classList.toggle('armed',capoArmed);
  const s=capoArmed?tr('Toca el traste donde va el capo','Tap the fret where the capo goes')
    :capo?tr(`Capo en el traste ${capo} · toca para quitarlo, o arrástralo a otro traste`,`Capo on fret ${capo} · tap to remove, or drag it to another fret`)
    :tr('Capo · arrástralo a un traste (o tócalo y luego toca un traste)','Capo · drag it onto a fret (or tap it, then tap a fret)');
  b.dataset.tip=s; b.setAttribute('aria-label',s);
}

function renderBoard(chord){
  const map=chord?new Map(chord.tones.map(t=>[t.pc,t])):null;
  // sin acorde (una nota, un intervalo…): se resaltan en otros trastes las mismas notas que están seleccionadas
  const selPcs=chord?null:new Set(getNotes().map(n=>n.midi%12));
  for(const c of cells){
    const pc=(OPEN[c.s]+c.f)%12, on=sel[c.s]===c.f, t=map&&map.get(pc), dead=c.f<capo;
    let cls='dot';
    if(on) cls+=' on'+(c.f===capo?' ring':'');
    else if(showAll&&!dead) cls+=(t||(selPcs&&selPcs.has(pc)))?' hint':' ghost';
    else cls+=' off';
    c.dot.className=cls;
    c.dot.style.setProperty('--c',t?`var(--${t.role})`:'var(--neutral)');
    c.dot.textContent=(on||(showAll&&!dead))?fmt(t?t.name:NEUTRAL[pc]):'';
    c.el.setAttribute('aria-pressed',on);
    c.el.disabled=dead; c.el.classList.toggle('dead',dead);
  }
}

function chip(role,label,text){return `<span class="chip"><i style="--c:var(--${role})">${label}</i>${text}</span>`}
const bigB=txt=>`<button class="bigbtn" id="chordbtn" data-tip="${tr('Elegir un acorde','Pick a chord')}">${txt}</button>`;

    h=`<div class="eyebrow">${tr('Mástil vacío','Empty fretboard')}</div><div class="big sm">${tr('Toca una nota','Tap a note')}</div><div class="sub">${tr('Con una nota ves su nombre, con dos el intervalo y con tres o más el acorde.','One note shows its name, two show the interval, three or more show the chord.')}</div>`;
  }else if(notes.length===1){

  }else if(notes.length===2){
    const [a,b]=notes, d=b.midi-a.midi, an=NEUTRAL[a.midi%12], bn=NEUTRAL[b.midi%12];
    h=`<div class="eyebrow">${tr('Intervalo','Interval')}</div><div class="big">${bigB(intName(d))}</div><div class="sub">${fmt(an)}${oct(a.midi)} → ${fmt(bn)}${oct(b.midi)} · ${d} ${d===1?tr('semitono','semitone'):tr('semitonos','semitones')}</div>
       <div class="chips">${chip('neutral','•',fmt(an)+oct(a.midi))}${chip('neutral','•',fmt(bn)+oct(b.midi))}</div>`;
  }else if(cands.length){
    const c=cands[0], bassPc=notes[0].midi%12, bt=c.tones.find(t=>t.pc===bassPc), bi=c.tones.indexOf(bt);
    const chips=notes.map(n=>{const t=c.tones.find(t=>t.pc===n.midi%12);return chip(t.role,t.label,fmt(t.name)+oct(n.midi))}).join('');
    const alts=cands.slice(1,5).map(x=>`<b>${symOf(x,bassPc)}</b>`).join(' · ');
    h=`<div class="rhead"><div><div class="eyebrow">${tr('Acorde','Chord')}${bi>0?' · '+invNames()[bi].toLowerCase():''}</div><div class="big">${bigB(symOf(c,bassPc))}</div></div></div>
       <div class="sub">${fmt(c.rootName)} ${descT(c.t)}${bi>0?tr(' · bajo en ',' · bass on ')+fmt(bt.name):''}</div>
       <div class="chips">${chips}</div>${alts?`<div class="alt">${tr('También se lee: ','Also reads as: ')}${alts}</div>`:''}`;
  }else{
    // 3+ cuerdas pero solo 1 o 2 nombres de nota distintos: no es un acorde, se lee como nota o intervalo
    const b=notes[0].midi%12, pcs=[...new Set(notes.map(n=>n.midi%12))];
    const chips=notes.map(n=>chip('neutral','•',fmt(NEUTRAL[n.midi%12])+oct(n.midi))).join('');
    if(pcs.length===1) h=`<div class="eyebrow">${tr('Nota repetida','Repeated note')}</div><div class="big">${bigB(fmt(NEUTRAL[b]))}</div><div class="sub">${notes.length} ${tr('cuerdas con la misma nota, en distintas octavas.','strings with the same note, in different octaves.')}</div><div class="chips">${chips}</div>`;
    else{const d=mod(pcs.find(p=>p!==b)-b,12);
      h=`<div class="eyebrow">${tr('Intervalo','Interval')}</div><div class="big">${bigB(intName(d))}</div><div class="sub">${tr('Solo '+pcs.length+' notas distintas ('+pcs.map(p=>fmt(NEUTRAL[p])).join(' y ')+'), así que no forman un acorde.','Only '+pcs.length+' different notes ('+pcs.map(p=>fmt(NEUTRAL[p])).join(' and ')+'), so they do not form a chord.')}</div><div class="chips">${chips}</div>`}
  }
  el.innerHTML=h;
  if(!notes.length){
    el.insertAdjacentHTML('beforeend',`<div><button class="linkbtn" id="pickbtn">${tr('Elegir un acorde','Pick a chord')} ▾</button></div>`);
    $('pickbtn').onclick=()=>openBuilder(null);
  }
  const cb=$('chordbtn'); if(cb) cb.onclick=()=>openBuilder(cands[0]);
}

/* ---------- inversiones ---------- */
/* ¿Se puede tocar con una mano? Reglas:
   - los trastes con dedo caben en 4 trastes seguidos (diferencia máxima 3);
   - un dedo puede cubrir varias cuerdas solo en el mismo traste (cejilla) y si todas las cuerdas
     entre medio están en ese traste o más arriba (si no, la cejilla las apagaría o cambiaría su nota);
   - máximo 4 dedos; a mayor traste, dedo más a la derecha (índice a meñique);
   - dos dedos distintos no se separan más de (dedos de distancia + 1) trastes. */
function playable(s,fr){
  const notes=[]; fr.forEach((f,k)=>{if(f>0) notes.push({k,f})});
  if(!notes.length) return true;
  const frets=notes.map(n=>n.f);
  if(Math.max(...frets)-Math.min(...frets)>3) return false;
  const groups=[];
  for(const g of [...new Set(frets)].sort((a,b)=>a-b)){
    let cur=null;
    for(const n of notes.filter(n=>n.f===g)){
      let join=!!cur;
      if(join) for(let t=cur.last+1;t<n.k;t++) if(fr[t]<g){join=false;break}
      if(join) cur.last=n.k; else {cur={f:g,last:n.k};groups.push(cur)}
    }
  }
  const k=groups.length; if(k>4) return false;
  const as=[];
  function rec(i,prev){
    if(i===k) return true;
    for(let f=prev+1;f<=4-(k-1-i);f++){
      let ok=true;
      for(let j=0;j<i;j++) if(groups[i].f-groups[j].f>f-as[j]+1){ok=false;break}
      if(!ok) continue;
      as[i]=f; if(rec(i+1,f)) return true;
    }
    return false;
  }
  return rec(0,0);
}
function findVoicings(pcs,bass,n,cp=0){
  // n = cuerdas seleccionadas: cada forma usa exactamente n cuerdas seguidas y repite notas si hace falta.
  // cp = traste del capo: ahí está la "cuerda al aire"; no hay trastes detrás. frets = absolutos, rel = relativos al capo.
  const res=[];
  for(let s=0;s<=6-n;s++){
    const fr=[],ms=[];
    (function go(i,rem){
      if(rem.size>n-i) return;
      if(i===n){
        const rel=fr.map(f=>f-cp), fretted=rel.filter(f=>f>0), mx=fretted.length?Math.max(...fretted):0, mn=fretted.length?Math.min(...fretted):0;
        if(rel.includes(0)&&mx>5) return;
        if(!playable(s,rel)) return;
        res.push({s,frets:[...fr],rel,min:mn});
        return;
      }
      const si=s+i;
      for(let f=cp;f<=FRETS;f++){
        const pc=(OPEN[si]+f)%12;
        if(i===0?pc!==bass:!pcs.includes(pc)) continue;
        const m=OPEN[si]+f; if(ms.includes(m)) continue;
        const r2=new Set(rem); r2.delete(pc);
        fr.push(f); ms.push(m); go(i+1,r2); fr.pop(); ms.pop();
      }
    })(0,new Set(pcs));
  }
  return res.sort((a,b)=>(a.min-b.min)||(a.s-b.s));
}
function diagram(v,c){
  const x0=14,dx=11.2,y0=24,dy=16;
  const rl=v.rel||v.frets, cp=v.frets[0]-rl[0]; // cp = capo (0 si no hay)
  const fretted=rl.filter(f=>f>0), mx=fretted.length?Math.max(...fretted):1, mn=fretted.length?Math.min(...fretted):1;
  const start=mx<=5?1:mn;
  let g='';
  for(let i=0;i<6;i++) g+=`<line x1="${x0+i*dx}" y1="${y0}" x2="${x0+i*dx}" y2="${y0+5*dy}" stroke="var(--muted)" stroke-width="1" opacity=".7"/>`;
  for(let j=0;j<=5;j++) g+=`<line x1="${x0}" y1="${y0+j*dy}" x2="${x0+5*dx}" y2="${y0+j*dy}" stroke="var(--muted)" stroke-width="${j===0&&start===1?3.2:1}" opacity="${j===0&&start===1?1:.7}"/>`;
  if(start>1||cp>0) g+=`<text x="${x0-5}" y="${y0+dy/2+3}" text-anchor="end" font-size="8" font-family="var(--font-m)" fill="var(--ink)">${start+cp}</text>`;
  for(let i=0;i<6;i++){
    const k=i-v.s;
    if(k<0||k>=v.frets.length){g+=`<text x="${x0+i*dx}" y="${y0-8}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="var(--font-m)">×</text>`;continue}
    const f=rl[k], t=c.tones.find(t=>t.pc===(OPEN[i]+v.frets[k])%12), col=`var(--${t.role})`, cx=x0+i*dx;
    if(f===0) g+=`<circle cx="${cx}" cy="${y0-9}" r="3.6" fill="none" stroke="${col}" stroke-width="1.8"/>`;
    else{const cy=y0+(f-start)*dy+dy/2;g+=`<circle cx="${cx}" cy="${cy}" r="5.4" fill="${col}"/><text x="${cx}" y="${cy+2.6}" text-anchor="middle" font-size="7" font-weight="600" font-family="var(--font-m)" fill="var(--ontone)">${t.label}</text>`}
  }
  return `<svg viewBox="-4 0 90 112" role="img" aria-hidden="true">${g}</svg>`;
}
const invNames=()=>lang==='en'
  ?['Root position','1st inversion','2nd inversion','3rd inversion','4th inversion','5th inversion']
  :['Fundamental','1ª inversión','2ª inversión','3ª inversión','4ª inversión','5ª inversión'];
function renderInv(c,notes){
  const box=$('inv');
  if(!c||!invOpen){box.hidden=true;voiceList=[];return}
  const key=c.root+'-'+c.ti, n=notes.length;
  if(key!==lastKey){lastKey=key;invMore=false;invIdx=Math.max(0,c.tones.findIndex(t=>t.pc===notes[0].midi%12))}
  if(invIdx>=c.tones.length) invIdx=0;
  const pcs=c.tones.map(t=>t.pc);
  const list=findVoicings(pcs,c.tones[invIdx].pc,n,capo);
  voiceList=invMore?list:list.slice(0,12);
  const names=invNames();
  const tabs=c.tones.map((t,i)=>`<button class="tab" data-i="${i}" aria-pressed="${i===invIdx}">${names[i]}<small>${tr('bajo','bass')} ${fmt(t.name)}</small></button>`).join('');
  const cards=voiceList.map((v,i)=>{
    const strs=v.frets.map((_,k)=>6-(v.s+k)).join('·'), mn=v.frets.filter(f=>f>capo);
    return `<button class="vcard" data-v="${i}">${diagram(v,c)}<span class="vmeta">${tr('cuerdas','strings')} ${strs}<br>${mn.length?tr('traste ','fret ')+Math.min(...mn):capo?'capo '+capo:tr('al aire','open')}</span></button>`;
  }).join('');
  const sub=list.length
    ?tr(`${list.length} formas de ${n} cuerdas seguidas${n>c.tones.length?' (repiten notas del acorde)':''}, ${names[invIdx].toLowerCase()}. Toca una para ponerla en el mástil.`,
        `${list.length} shapes on ${n} adjacent strings${n>c.tones.length?' (repeating chord notes)':''}, ${names[invIdx].toLowerCase()}. Tap one to place it on the fretboard.`)
    :tr(`No hay formas de ${n} cuerdas seguidas tocables en los primeros 15 trastes.`,`No playable shapes on ${n} adjacent strings within the first 15 frets.`);
  box.innerHTML=`<h2>${tr('Inversiones de ','Inversions of ')}${fmt(c.rootName)}${symT(c.t)}</h2>
    <div class="tabs">${tabs}</div>
    <div class="sub">${sub}</div>
    <div class="vgrid">${cards}</div>
    ${!invMore&&list.length>12?`<div><button class="btn" id="more">${tr('Mostrar las ','Show all ')}${list.length}</button></div>`:''}`;
  box.hidden=false;
  box.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{invIdx=+b.dataset.i;invMore=false;update()});
  box.querySelectorAll('.vcard').forEach(b=>b.onclick=()=>applyVoicing(voiceList[+b.dataset.v],c));
  const m=$('more'); if(m) m.onclick=()=>{invMore=true;update()};
}
function applyVoicing(v,c){
  sel=[null,null,null,null,null,null];
  v.frets.forEach((f,k)=>{sel[v.s+k]=f});
  pinned={root:c.root,ti:c.ti}; // sigue leyéndose como el mismo acorde, ahora invertido
  update(); strum();
}

/* ---------- creador de acordes ---------- */
function makeChord(root,ti){
  const t=TPL[ti], rootName=(t.minor?MIN_ROOT:MAJ_ROOT)[root];
  const tones=t.tones.map(x=>({...x,pc:(root+x.semis)%12,name:spell(rootName,x.semis,x.step)}));
  return {root,rootName,t,ti,tones,bassIsRoot:true};
}
/* Primera forma tocable: fundamental si existe; si no, la primera inversión que sí se pueda; y si hace falta, con cuerdas extra. */
function pickStart(c){
  const pcs=c.tones.map(t=>t.pc);
  for(let n=c.tones.length;n<=6;n++)
    for(let b=0;b<c.tones.length;b++){
      const list=findVoicings(pcs,c.tones[b].pc,n,capo);
      if(list.length) return {v:list[0],n,bassIdx:b};
    }
  return null;
}
let bRoot=0,bTi=0;
const ROOT_LAB=['C','C♯/D♭','D','D♯/E♭','E','F','F♯/G♭','G','G♯/A♭','A','A♯/B♭','B'];
function buildDlgRender(){
  $('broots').innerHTML=ROOT_LAB.map((l,i)=>`<button class="opt" data-r="${i}" aria-pressed="${i===bRoot}">${notation==='sol'?l.replace(/[A-G]/g,m=>SOL[m]):l}</button>`).join('');
  $('btypes').innerHTML=TPL.map((t,i)=>`<button class="opt" data-t="${i}" aria-pressed="${i===bTi}">${symT(t)||tr('Mayor','Major')}<small>${descT(t)}</small></button>`).join('');
  $('broots').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{bRoot=+b.dataset.r;buildDlgRender()});
  $('btypes').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{bTi=+b.dataset.t;buildDlgRender()});
  const c=makeChord(bRoot,bTi), st=pickStart(c);
  $('bprev').innerHTML=`<b>${fmt(c.rootName)}${symT(c.t)}</b>${c.tones.map(t=>fmt(t.name)).join(' · ')}${st?'':'<br>'+tr('No hay forma tocable de este acorde en los primeros 15 trastes.','No playable shape of this chord within the first 15 frets.')}`;
  $('bok').disabled=!st;
}
function applyBuilt(){
  const c=makeChord(bRoot,bTi), st=pickStart(c); if(!st) return;
  sel=[null,null,null,null,null,null];
  st.v.frets.forEach((f,k)=>{sel[st.v.s+k]=f});
  pinned={root:c.root,ti:c.ti}; invOpen=true; lastKey='';
  update(); strum();
}
const dlg=$('builder');
function openBuilder(c){
  if(c&&c.ti<TPL.length){bRoot=c.root;bTi=c.ti}
  buildDlgRender(); dlg.showModal();
}
/* ---------- partitura ---------- */
/* Modelo puro: cada nota → letra, alteración, octava escrita (la guitarra se escribe una octava arriba de lo que suena) y posición en el pentagrama. */
function sheetModel(notes,chord){
  const map=chord?new Map(chord.tones.map(t=>[t.pc,t])):null, seen=new Set(), items=[];
  for(const n of notes){
    if(seen.has(n.midi)) continue; seen.add(n.midi);
    const pc=n.midi%12, t=map&&map.get(pc), name=t?t.name:NEUTRAL[pc];
    const L=name[0], acc=name.slice(1), off=[...acc].reduce((a,c)=>a+(c==='♯'?1:-1),0), li=LET.indexOf(L);
    const w=n.midi+12, wo=Math.round((w-off-LETPC[li])/12)-1, idx=wo*7+li;
    items.push({midi:n.midi,name,L,acc,off,idx,wo,y:40-(idx-30)*5,role:t?t.role:null,label:name+(wo-1)});
  }
  items.sort((a,b)=>a.idx-b.idx||a.midi-b.midi);
  let prev=null;
  items.forEach(it=>{it.right=!!prev&&it.idx-prev.idx<=1&&!prev.right; prev=it});
  items.forEach((it,i)=>{ // columnas de alteraciones para que no se encimen
    let k=0; for(let j=0;j<i;j++) if(items[j].acc&&Math.abs(items[j].idx-it.idx)<6&&items[j].accCol===k) k++;
    it.accCol=it.acc?k%3:0;
  });
  return items;
}
function renderSheet(notes,chord){
  const box=$('sheet'); box.hidden=!sheetOpen;
  $('top').classList.toggle('hassheet',wideMq.matches&&sheetOpen);
  if(!sheetOpen) return;
  const items=sheetModel(notes,chord), cx=96, W=190;
  const ys=items.map(i=>i.y), minY=Math.min(-22,...ys.map(y=>y-12)), maxY=Math.max(76,...ys.map(y=>y+12));
  let g='';
  for(let i=0;i<5;i++) g+=`<line x1="0" y1="${i*10}" x2="${W}" y2="${i*10}" stroke="var(--muted)" stroke-width="1" opacity=".8"/>`;
  g+=`<path d="M 9 60 C 9 70, 21 68, 19 56 L 15 6 C 14 -8, 23 -12, 25 -2 C 27 8, 13 22, 9 30 C 5 40, 13 48, 21 44 C 29 40, 29 28, 19 26 C 11 24, 7 32, 12 36" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" transform="translate(2 0)"/>`;
  for(const it of items){
    const x=cx+(it.right?9:0), col=it.role?`var(--${it.role})`:'var(--neutral)';
    for(let p=-10;p>=it.y-0.1&&p>=-80;p-=10) g+=`<line x1="${x-11}" y1="${p}" x2="${x+11}" y2="${p}" stroke="var(--muted)" stroke-width="1.2"/>`;
    for(let p=50;p<=it.y+0.1&&p<=120;p+=10) g+=`<line x1="${x-11}" y1="${p}" x2="${x+11}" y2="${p}" stroke="var(--muted)" stroke-width="1.2"/>`;
  }
  for(const it of items){
    const x=cx+(it.right?9:0), col=it.role?`var(--${it.role})`:'var(--neutral)';
    g+=`<ellipse cx="${x}" cy="${it.y}" rx="6.6" ry="4.9" transform="rotate(-18 ${x} ${it.y})" fill="${col}" stroke="var(--ink)" stroke-width="1.1"/>`;
    if(it.acc) g+=`<text x="${cx-15-it.accCol*10}" y="${it.y+4}" text-anchor="middle" font-size="12" fill="currentColor" font-family="var(--font-b)">${it.acc}</text>`;
    if(showAll) g+=`<text x="${cx+26}" y="${it.y+3}" font-size="8.5" font-family="var(--font-m)" fill="var(--muted)">${fmt(it.name)}${it.wo-1}</text>`;
  }
  const names=items.map(i=>fmt(i.name)+(i.wo-1)).join(', ');
  box.innerHTML=`<div class="eyebrow">${tr('Partitura','Sheet music')}</div>
    <svg viewBox="0 ${minY} ${W} ${maxY-minY}" role="img" aria-label="${tr('Partitura: ','Sheet music: ')}${names||tr('sin notas','no notes')}">${g}</svg>
    <div class="cap">${items.length?tr('Clave de sol · escrito una octava arriba del sonido, como se lee la guitarra.','Treble clef · written an octave above the sound, as guitar is notated.'):tr('Toca notas en el mástil y aparecen aquí.','Tap notes on the fretboard and they appear here.')}</div>`;
}

/* ---------- tooltips (mouse: al pasar; teclado: al enfocar; celular: presión larga) ---------- */
const tipEl=document.createElement('div'); tipEl.id='tip'; tipEl.setAttribute('role','tooltip'); document.body.appendChild(tipEl);
let tipTimer=null, tipHide=null, swallow=false;
function showTip(el){
  const t=el.dataset.tip; if(!t) return;
  tipEl.textContent=t; tipEl.classList.add('show');
  const r=el.getBoundingClientRect(), w=tipEl.offsetWidth, h=tipEl.offsetHeight;
  let top=r.bottom+8; if(top+h>innerHeight-4) top=r.top-h-8;
  tipEl.style.left=Math.max(6,Math.min(innerWidth-w-6,r.left+r.width/2-w/2))+'px';
  tipEl.style.top=Math.max(4,top)+'px';
}
function hideTip(){tipEl.classList.remove('show');clearTimeout(tipHide)}
const tipOf=e=>e.target.closest&&e.target.closest('[data-tip]');
document.addEventListener('pointerover',e=>{if(e.pointerType==='mouse'){const b=tipOf(e); if(b) showTip(b)}});
document.addEventListener('pointerout',e=>{if(e.pointerType==='mouse'&&tipOf(e)) hideTip()});
document.addEventListener('focusin',e=>{const b=tipOf(e); if(b&&b.matches(':focus-visible')) showTip(b)});
document.addEventListener('focusout',hideTip);
document.addEventListener('pointerdown',e=>{
  clearTimeout(tipTimer); if(e.pointerType==='mouse') return;
  const b=tipOf(e); if(!b) return;
  tipTimer=setTimeout(()=>{swallow=true;showTip(b);clearTimeout(tipHide);tipHide=setTimeout(hideTip,2000)},450);
});
['pointerup','pointercancel','pointermove'].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.pointerType==='mouse') return;
  clearTimeout(tipTimer); if(ev==='pointerup') setTimeout(()=>{swallow=false},350);
}));
document.addEventListener('click',e=>{if(swallow){e.preventDefault();e.stopPropagation();swallow=false}},true);
document.addEventListener('contextmenu',e=>{if(tipOf(e)) e.preventDefault()});

/* ---------- control ---------- */
function update(){
  const notes=getNotes(), cands=notes.length>=3?detect(notes):[];
  if(pinned){const i=cands.findIndex(x=>x.root===pinned.root&&x.ti===pinned.ti);
    if(i<0) pinned=null; else if(i>0) cands.unshift(...cands.splice(i,1))}
  const chord=cands[0]||null; curChord=chord;
  renderBoard(chord); renderReadout(notes,cands);
  if(capo){const ey=$('readout').querySelector('.eyebrow'); if(ey) ey.textContent+=' · capo '+capo} renderSheet(notes,chord); renderInv(chord,notes);
}

/* arrastrar el capo (botón → traste). Tocar sin arrastrar: quita el capo, o lo "arma" para el siguiente toque en un traste. */
{
  const btn=$('capo'); let drag=null, ghost=null, over=0;
  const cellAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY), c=el&&el.closest&&el.closest('.cell'); return c&&c.dataset.f?+c.dataset.f:0};
  const end=()=>{if(ghost){ghost.remove();ghost=null} drawCapo(); drag=null; over=0};
  btn.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    drag={x:e.clientX,y:e.clientY,moved:false};
    try{btn.setPointerCapture(e.pointerId)}catch(_){}
  });
  btn.addEventListener('pointermove',e=>{
    if(!drag) return;
    if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){
      drag.moved=true; hideTip(); ghost=document.createElement('div'); ghost.className='dragghost'; ghost.textContent=btn.textContent; document.body.appendChild(ghost);
    }
    if(drag.moved){
      ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
      const f=cellAt(e); if(f!==over){over=f; drawCapo(f>=1?f:undefined)}
    }
  });
  btn.addEventListener('pointerup',e=>{
    if(!drag) return;
    if(drag.moved){const f=cellAt(e); end(); if(f>=1) setCapo(f); return}
    end();
    if(capo) setCapo(0); else {capoArmed=!capoArmed; syncCapoBtn()}
  });
  btn.addEventListener('pointercancel',end);
  btn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); if(capo) setCapo(0); else {capoArmed=!capoArmed; syncCapoBtn()}} });
  btn.addEventListener('click',e=>e.preventDefault());
}
